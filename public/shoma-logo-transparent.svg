<svg viewBox="0 0 200 56" xmlns="http://www.w3.org/2000/svg" width="200" height="56">
  <!-- Transparent background (no fill) -->

  <!-- Shoma Logo: Circle + Text -->
  <!-- Inspiration: Teal circle with education-focused design -->

  <!-- Main circle mark -->
  <circle cx="16" cy="28" r="14" fill="#6e4d1c" opacity="0.95"/>

  <!-- Inner education symbol: Open book -->
  <g transform="translate(16, 28)">
    <!-- Left page -->
    <path d="M -6 -5 L -2 -5 L -2 5 L -6 5 Z" fill="white" opacity="0.9"/>
    <!-- Right page -->
    <path d="M 2 -5 L 6 -5 L 6 5 L 2 5 Z" fill="white" opacity="0.85"/>
    <!-- Center fold line -->
    <line x1="0" y1="-5" x2="0" y2="5" stroke="white" stroke-width="0.8" opacity="0.8"/>
  </g>

  <!-- Text: "SHOMA" -->
  <text x="38" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#6e4d1c" letter-spacing="-0.5">
    SHOMA
  </text>

  <!-- Accent line under text -->
  <line x1="38" y1="40" x2="85" y2="40" stroke="#ef9403" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

  <!-- Tagline (optional, can be removed for navbar use) -->
  <text x="38" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#6e4d1c" opacity="0.6" letter-spacing="0.5">
    EDUCATION IN TANZANIA
  </text>
</svg>